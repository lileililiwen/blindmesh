version: 1
runtime: driftwatchdog
profile: dotnet-product
rule_pack: workspace-governance@1
checks:
  repository: true
  build: true
  tests: true
  security: true
  product_quality: false
  declared-verification: true
  governance-quality: true
  ui-conformance: true
  check-openspec-change-names: true
blocking:
  - FAIL
  - REVIEW_REQUIRED
timeouts:
  build: 300000
  tests: 300000
  declared-verification: 180000
  ui-conformance: 120000
notes:
  - The native build, test and security checks are bound to the real commands of the
    runtime foundation. The shared governance/Gate are development tooling; the
    product runtime must remain portable.
  - The security check scans the shipped dependency sets. The public platform feed
    is unreachable, so the NuGet scan names nuget.org explicitly; the platform
    adoption is blocked and recorded in docs/foundation/platform-adoption.md.
  - The frontend scan covers the production dependencies. The advisories of the
    lint toolchain are development only, have no patched release and are recorded
    in HANDOFF.md.

commands:
  repository: 'git diff --check'
  build: 'dotnet build Blindmesh.sln -c Release --no-restore'
  tests: 'dotnet test Blindmesh.sln -c Release'
  security: 'dotnet list Blindmesh.sln package --vulnerable --include-transitive --no-restore --source https://api.nuget.org/v3/index.json && npm --prefix apps/web audit --omit=dev --audit-level=high'
  declared-verification: 'python3 scripts/verify_bootstrap.py && node scripts/check-openspec-change-names.mjs && openspec validate --all --strict --no-interactive'
  check-openspec-change-names: 'node scripts/check-openspec-change-names.mjs'
  governance-quality: 'python3 ../forge/modules/workspace-governance/scripts/workspace_check.py --root .. --project blindmesh --json'
  # Generated by workspace-governance/scripts/bind_ui_gate.py. A verifier that
  # no gate runs does not gate (ruling D18). Re-run the generator to update it;
  # do not hand-edit.
  ui-conformance: 'python3 ../forge/modules/workspace-governance/scripts/ui_conformance.py .'
